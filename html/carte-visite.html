<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte de visite — échantillon</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9DFCF;color:#2E2A1F;font-family:'Nunito Sans',system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:40px 16px;display:grid;gap:28px}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:32px;margin:0}
.eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#6B4A32;font-weight:700;margin:0}
.row{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
figure{margin:0}
figcaption{font-size:13px;color:#5C5241;text-align:center;margin-top:10px}

/* Carte : 85 × 55 mm, affichée à 5 px/mm */
.card{--bg:#FBF7F0;--k:#6B4A32;--br:#8C7A66;--fl:#DDB3AA;--flc:#A8644F;
  width:425px;max-width:calc(100vw - 32px);aspect-ratio:85/55;background:var(--bg);border-radius:14px;position:relative;overflow:hidden;
  box-shadow:0 8px 24px rgba(58,43,31,.18);box-sizing:border-box}
.card::before{content:"";position:absolute;inset:9px;border:1.2px dashed rgba(107,74,50,.35);border-radius:9px;pointer-events:none}
.khaki{--bg:#4F5229;--k:#F4EEE3;--br:#B9B48C;color:#F4EEE3}
.khaki::before,.bark::before{border-color:rgba(244,238,227,.35)}
.bark{--bg:#3A2B1F;--k:#E3D6C2;--br:#9C8670;color:#F4EEE3}

.front{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.front b{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:600;line-height:1}
.front small{font-size:11px;letter-spacing:.32em;text-transform:uppercase;opacity:.8}

.back{display:grid;grid-template-columns:1fr auto;align-items:center;padding:30px 32px;gap:16px}
.back .name{font-family:Fraunces,Georgia,serif;font-size:24px;line-height:1.1}
.back .role{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6B4A32;font-weight:700;margin:4px 0 14px}
.back ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
.back li{display:flex;align-items:center;gap:8px}
.back li svg{flex:none}
.back .quote{grid-column:1/-1;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:13px;color:#5E6233;border-top:1.2px dashed #BFAE92;padding-top:10px}

/* Branche qui déborde dans le coin */
.corner{position:absolute;right:-18px;bottom:-22px;opacity:.9}

@page{size:A4;margin:15mm}
@media print{
  body{background:none}
  main>div:first-child{display:none}
  .card{width:85mm;max-width:none;border-radius:3mm;box-shadow:none;outline:.2mm solid #ccc}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="fl" viewBox="-6 -6 12 12">
    <g fill="var(--fl)">
      <ellipse cx="0" cy="-3" rx="2" ry="2.8"/>
      <ellipse cx="0" cy="-3" rx="2" ry="2.8" transform="rotate(72)"/>
      <ellipse cx="0" cy="-3" rx="2" ry="2.8" transform="rotate(144)"/>
      <ellipse cx="0" cy="-3" rx="2" ry="2.8" transform="rotate(216)"/>
      <ellipse cx="0" cy="-3" rx="2" ry="2.8" transform="rotate(288)"/>
    </g>
    <circle r="1.1" fill="var(--flc)"/>
  </symbol>
  <g id="scissors" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <ellipse cx="13" cy="8.5" rx="3.6" ry="4.2"/><ellipse cx="13" cy="43.5" rx="3.6" ry="4.2"/><path d="M13 12.7v26.6"/>
    <path d="M14.5 24 44 6.5Q33 17.5 17.5 28.5"/><path d="M14.5 28 44 45.5Q33 34.5 17.5 23.5"/>
  </g>
  <symbol id="k" viewBox="0 0 52 52">
    <g fill="none" stroke="var(--br)" stroke-linecap="round">
      <path d="M1 49C10 43 17 39 25 33S41 20 51 9" stroke-width="1.6"/>
      <path d="M18 38.5c-1-3-.5-6 1.5-8.5" stroke-width="1.1"/>
      <path d="M36 23c3 .5 5.5 2 7 4.5" stroke-width="1.1"/>
      <path d="M45 15.5c-.5-2.5 0-5 1.5-7" stroke-width="1"/>
    </g>
    <use href="#fl" x="16" y="25" width="7" height="7"/>
    <use href="#fl" x="40.5" y="24.5" width="6.5" height="6.5"/>
    <use href="#fl" x="44" y="3.5" width="6" height="6"/>
    <use href="#fl" x="2" y="42" width="5" height="5"/>
    <circle cx="27" cy="33.5" r="1.3" fill="var(--fl)"/>
    <circle cx="49" cy="12" r="1.1" fill="var(--fl)"/>
    <use href="#scissors" stroke="var(--bg)" stroke-width="4.2"/>
    <use href="#scissors" stroke="var(--k)" stroke-width="1.6"/>
    <circle cx="15.6" cy="26" r="1.7" fill="var(--k)"/>
  </symbol>
  <!-- Branche décorative seule, pour les coins -->
  <symbol id="branch" viewBox="0 0 120 80">
    <g fill="none" stroke="var(--br)" stroke-linecap="round">
      <path d="M118 6C96 18 78 30 60 44S24 68 2 78" stroke-width="1.6"/>
      <path d="M78 31c-2-6-1-11 3-15" stroke-width="1.1"/>
      <path d="M48 53c-6 0-10 2-13 6" stroke-width="1.1"/>
      <path d="M96 19c4 2 6 6 6 10" stroke-width="1"/>
    </g>
    <use href="#fl" x="75" y="10" width="10" height="10"/>
    <use href="#fl" x="28" y="55" width="9" height="9"/>
    <use href="#fl" x="97" y="27" width="8" height="8"/>
    <use href="#fl" x="56" y="36" width="7" height="7"/>
    <circle cx="66" cy="40" r="1.6" fill="var(--fl)"/>
    <circle cx="14" cy="72" r="1.4" fill="var(--fl)"/>
  </symbol>
</svg>

<main>
  <div><p class="eyebrow">Échantillon · 85 × 55 mm</p><h1>Carte de visite</h1></div>

  <div class="row">
    <figure>
      <div class="card khaki front">
        <svg width="78" height="78"><use href="#k"/></svg>
        <div><b>Kat's Eye</b><br><small>Création</small></div>
      </div>
      <figcaption>Recto · kaki</figcaption>
    </figure>
    <figure>
      <div class="card back">
        <div>
          <p class="name" style="margin:0">Kat [Nom]</p>
          <p class="role">Couturière · créations fait main</p>
          <ul>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E6233" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>[e-mail]</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E6233" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".8" fill="#5E6233"/></svg>@[instagram]</li>
            <li><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E6233" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>[site web]</li>
          </ul>
        </div>
        <svg width="56" height="56"><use href="#k"/></svg>
        <p class="quote" style="margin:0">Pièces uniques &amp; petites séries, cousues avec soin.</p>
      </div>
      <figcaption>Verso · crème</figcaption>
    </figure>
  </div>

  <p class="eyebrow" style="text-align:center;margin-top:12px">Variante</p>
  <div class="row">
    <figure>
      <div class="card front">
        <svg class="corner" width="210" height="140"><use href="#branch"/></svg>
        <svg width="70" height="70" style="position:relative"><use href="#k"/></svg>
        <div style="position:relative"><b>Kat's Eye</b><br><small style="color:#6B4A32">Création</small></div>
      </div>
      <figcaption>Recto · crème, branche en coin</figcaption>
    </figure>
    <figure>
      <div class="card bark front" style="gap:6px">
        <svg class="corner" width="210" height="140" style="left:-30px;top:-30px;right:auto;bottom:auto;transform:scale(-1,-1)"><use href="#branch"/></svg>
        <p style="margin:0;font-family:Fraunces,Georgia,serif;font-size:22px;position:relative">Kat [Nom]</p>
        <p style="margin:0;font-size:13px;opacity:.85;position:relative">[e-mail] · @[instagram]</p>
        <p style="margin:0;font-size:13px;opacity:.85;position:relative">[site web]</p>
      </div>
      <figcaption>Verso · bois foncé</figcaption>
    </figure>
  </div>
</main>
</body>
</html>
